server {
    server_name clinidea.in www.clinidea.in;

    location / {
        root /var/www/clinidea/dist;
        try_files $uri $uri/ /index.html;
        index index.html;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:5001/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 500M;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        client_max_body_size 500M;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # Vigithink Safety Frontend
    location /vigithink/ {
        root /var/www/vigithinksafety;
        try_files $uri $uri/ /vigithink/index.html;
    }

    # Vigithink Safety Backend API
    location /vigithink-api/ {
        rewrite ^/vigithink-api/(.*)$ /api/$1 break;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/clinidea.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/clinidea.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}server {
    if ($host = www.clinidea.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = clinidea.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name clinidea.in www.clinidea.in;
    return 404; # managed by Certbot




}